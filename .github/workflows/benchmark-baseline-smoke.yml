name: Recompute owner baseline for shared SITE benchmarks
on:
  push:
    branches: [site-shared-benchmark-pilot-20261008]
    paths: [.github/workflows/benchmark-baseline-smoke.yml]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Unpack pinned native scientific core
        run: python3 benchmarks/unpack_core.py benchmarks/core/scientific-core.zip --pin benchmarks/core/core-pin.json --destination worker-work
      - name: Fetch official data with fixed checksums
        run: python3 benchmarks/prepare_worker_data.py worker-data --pins benchmarks/core/worker-data-pin.json --candidate benchmarks/tests/historical-baseline.json
      - uses: matlab-actions/setup-matlab@aa8bbc7b76daa63c5d456d1430cbd6cb5b626ab4
        with:
          release: R2026a
      - name: Recompute all original fits before accepting improvements
        uses: matlab-actions/run-command@37b454c384483087929a3d652be474ba585a9659
        with:
          command: >-
            addpath(fullfile(pwd,'benchmarks','worker'));
            core=fullfile(pwd,'worker-work','SAGEhydrology');addpath(fullfile(core,'models'));
            mex('-setup','C++');compile_crr_model_mex;
            pin=jsondecode(fileread(fullfile(pwd,'benchmarks','core','core-pin.json')));
            site_benchmark_admin_seed(core,fullfile(pwd,'worker-data'),
            fullfile(pwd,'benchmarks','tests','historical-baseline.json'),
            fullfile(pwd,'benchmarks','tests','profiles.json'),
            fullfile(pwd,'benchmarks','worker','worker-config.json'),
            fullfile(pwd,'benchmarks','tests','historical-baseline-pin.json'),
            fullfile(pwd,'verified-baseline'),[getenv('GITHUB_SHA') ':' pin.sha256]);
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-owner-baseline
          path: verified-baseline/
          retention-days: 7

# Bounded official-data download retry enabled.

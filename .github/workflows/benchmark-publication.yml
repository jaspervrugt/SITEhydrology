name: Check local references and publish benchmark contributions
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ['benchmarks/inbox/*.json']
permissions:
  contents: read
jobs:
  verify:
    # Administrator-controlled publication switch.
    if: vars.SITE_BENCHMARK_PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      # Never check out, import or run contributor source or workflows.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Validate and fetch numerical JSON only
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CANDIDATE_DIR: verified-candidates
        run: python3 benchmarks/check_pull_request.py
      - name: Check local evidence against the shared reference snapshot
        env:
          TRUSTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 benchmarks/local_reference_receipt.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: local-reference-checked-benchmarks
          path: |
            verified-candidates/
            verified-receipts/
          retention-days: 7
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: site-shared-benchmark-publisher
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      # Only the sibling trusted reference-check job can supply this artifact.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: local-reference-checked-benchmarks
          path: .
      - name: Prepare improvements against the newest shared results
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 benchmarks/publish_worker_batch.py --phase prepare
      - name: Unpack pinned export dependencies
        if: steps.prepare.outputs.changed == 'true'
        run: python3 benchmarks/unpack_core.py benchmarks/core/scientific-core.zip --pin benchmarks/core/core-pin.json --destination worker-work
      - uses: matlab-actions/setup-matlab@aa8bbc7b76daa63c5d456d1430cbd6cb5b626ab4
        if: steps.prepare.outputs.changed == 'true'
        with:
          release: R2026a
      - name: Export existing MAT and Excel result files
        if: steps.prepare.outputs.changed == 'true'
        uses: matlab-actions/run-command@37b454c384483087929a3d652be474ba585a9659
        with:
          command: >-
            addpath(fullfile(pwd,'benchmarks','worker'),fullfile(pwd,'utils','results'));
            site_benchmark_export_batch(fullfile(pwd,'publication'),
            fullfile(pwd,'worker-work','SAGEhydrology'),
            fullfile(pwd,'benchmarks','worker','worker-config.json'));
      - name: Commit result files and index together
        if: steps.prepare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 benchmarks/publish_worker_batch.py --phase finish
  merge:
    needs: [verify, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          # Older inbox PRs retain an old base SHA without this helper.
          # Use the immutable trusted revision that supplied this workflow.
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Merge the published numerical contribution
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 benchmarks/merge_published_contribution.py
